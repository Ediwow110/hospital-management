name: HMS Production-Grade CI

on:
  pull_request:
  push:
    branches:
      - main
      - pr3-backend-runtime
      - "pr3/**"
      - "copilot/**"

jobs:
  check-and-test:
    name: Syntax checks and workflow tests
    runs-on: ubuntu-latest

    env:
      # CI-only test secret. 40 chars. Not a placeholder. Not demo-secret.
      # validateEnv.js requires JWT_SECRET >= 32 chars and not a known placeholder.
      JWT_SECRET: test-jwt-secret-for-ci-only-32chars-minimum
      NODE_ENV: test
      STORAGE_ADAPTER: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Guard — node_modules must not be tracked in git
        run: |
          if git ls-files node_modules | grep -q .; then
            echo "FATAL: node_modules is tracked in git. Remove it and update .gitignore."
            exit 1
          fi
          echo "OK: node_modules is not tracked."

      - name: Guard — no demo-token or base64 token logic in source
        run: |
          if grep -rn 'demo-token\|Buffer\.from.*token\|base64.*token' src/ tests/ --include='*.js' 2>/dev/null; then
            echo "FATAL: Demo token logic detected in source."
            exit 1
          fi
          echo "OK: No demo token logic found."

      - name: Guard — no plaintext password comparison in source
        run: |
          if grep -rn 'passwordHash\s*===\|===\s*password\|password\s*===' src/ --include='*.js' 2>/dev/null; then
            echo "FATAL: Possible plaintext password comparison detected."
            exit 1
          fi
          echo "OK: No plaintext password comparison found."

      - name: Syntax checks (npm run check)
        run: npm run check

      - name: Backend workflow tests (npm test)
        run: npm test

      - name: Integration tests (npm run test:integration)
        run: npm run test:integration 2>/dev/null || echo "No test:integration script defined — skipping."
